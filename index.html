<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games 2012</title>
<style>
:root{--bg:#ffff80;--bar:#0000ff;--ok:#008000;--err:#ff0000;--ink:#000}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cambria,Georgia,serif;min-height:100vh}
#app{max-width:760px;margin:0 auto;padding:0 0 24px}
header{background:var(--bar);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:Arial,sans-serif}
header h1{font-size:18px;margin:0;flex:1;min-width:120px}
header .info{font-size:14px}
header button{background:transparent;border:1px solid #fff;color:#fff;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:14px}
#timer{font-variant-numeric:tabular-nums;font-weight:bold}
main{padding:16px}
.qnum{font-family:Arial,sans-serif;font-size:14px;margin-bottom:8px}
.topic{font-size:18px;font-weight:bold;margin:0 0 12px}
.qimg{display:block;max-width:100%;height:auto;margin:0 0 14px;border:1px solid #888;background:#fff}
.ans{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;margin:5px 0;border-radius:6px;border:2px solid transparent;background:rgba(255,255,255,.55);font-size:16px;font-weight:bold;font-style:italic;cursor:pointer}
.ans input{margin-top:5px;flex:none;width:17px;height:17px}
.ans.ok{border-color:var(--ok);background:#d4f5d4}
.ans.bad{border-color:var(--err);background:#ffd6d6}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;margin:6px 0;font-size:16px;font-weight:bold;font-style:italic}
.match select{font:inherit;padding:6px;border-radius:6px;border:2px solid #888;width:100%}
.match select.ok{border-color:var(--ok);background:#d4f5d4}
.match select.bad{border-color:var(--err);background:#ffd6d6}
.fb{font-weight:bold;font-size:18px;margin:12px 0 0;min-height:24px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--err)}
.nav{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{font-family:Arial,sans-serif;font-size:15px;padding:9px 18px;border:0;border-radius:6px;background:var(--bar);color:#fff;cursor:pointer}
.btn.sec{background:#555}.btn:disabled{opacity:.4;cursor:default}.sp{flex:1}
.res h2{margin:0 0 8px}
.score{font-size:22px;font-weight:bold;margin:8px 0}
.rev{background:rgba(255,255,255,.6);border-radius:6px;padding:8px 12px;margin:8px 0;font-size:15px}
.rev b.ok{color:var(--ok)}.rev b.bad{color:var(--err)}
.rev small{display:block;margin-top:3px}
@media print{header button,.nav{display:none}}
</style>
</head>

<main id="main"></main>
</div>

function start(){
  order=shuffle(Q);idx=0;remain=TIME_LIMIT;
  st=order.map(q=>({sel:q.type==="5"?{}:new Set(),done:false,right:false,
     opts:q.type==="5"?shuffle(q.answers.map(a=>a.text)):null}));
  clearInterval(tick);$("#timer").textContent=fmt(remain);
  tick=setInterval(()=>{remain--;$("#timer").textContent=fmt(Math.max(remain,0));
    if(remain<=0){clearInterval(tick);alert(T.timeUp);showResults(true)}},1000);
  showQ();
}
function isRight(q,s){
  if(q.type==="5")return q.answers.every(a=>s.sel[a.id]===a.text);
  const ok=q.answers.filter(a=>a.ok).map(a=>a.id);
  return ok.length===s.sel.size&&ok.every(i=>s.sel.has(i));
}
function showQ(){
  const q=order[idx],s=st[idx],m=$("#main");
  $("#qinfo").textContent=T.qof(idx+1,order.length);
  let h=`<p class="topic">${esc(q.topic)}</p>`;
  if(q.img)h+=`<img class="qimg" src="${IMG[q.img.key]}" width="${q.img.w}" height="${q.img.h}" alt="">`;
  if(q.type==="5"){
    q.answers.forEach((a,i)=>{h+=`<div class="match"><div>${esc(a.topic)}</div><select data-id="${a.id}"${s.done?" disabled":""}><option value="">${T.pick}</option>`+
      s.opts.map(o=>`<option${s.sel[a.id]===o?" selected":""}>${esc(o)}</option>`).join("")+`</select></div>`});
  }else{
    const type=q.type==="3"?"checkbox":"radio";
    q.answers.forEach(a=>{h+=`<label class="ans" data-id="${a.id}"><input type="${type}" name="a" value="${a.id}"${s.sel.has(a.id)?" checked":""}${s.done?" disabled":""}><span>${a.img?`<img src="${a.img}" alt="${esc(a.text)}" style="height:23px;vertical-align:middle">`:esc(a.text)}</span></label>`});
  }
  h+=`<div class="fb" id="fb"></div><div class="nav">
   <button class="btn sec" id="prev"${idx===0?" disabled":""}>${T.prev}</button>
   <button class="btn" id="sub"${s.done?" disabled":""}>${T.submit}</button><span class="sp"></span>
   <button class="btn sec" id="next">${idx===order.length-1?T.results:T.next}</button></div>`;
  m.innerHTML=h;
  m.querySelectorAll('input').forEach(i=>i.onchange=()=>{
    if(q.type==="2")s.sel=new Set([i.value]);else i.checked?s.sel.add(i.value):s.sel.delete(i.value)});
  m.querySelectorAll('select').forEach(e=>e.onchange=()=>{s.sel[e.dataset.id]=e.value});
  $("#sub").onclick=submit;
  $("#prev").onclick=()=>{idx--;showQ()};
  $("#next").onclick=()=>{if(idx<order.length-1){idx++;showQ()}else finish()};
  if(s.done)mark(q,s);
}
function submit(){
  const q=order[idx],s=st[idx];
  const has=q.type==="5"?q.answers.every(a=>s.sel[a.id]):s.sel.size>0;
  if(!has){$("#fb").textContent="";return}
  s.done=true;s.right=isRight(q,s);play(s.right?"succ":"error");
  m_disable();mark(q,s);$("#sub").disabled=true;
}
function m_disable(){document.querySelectorAll('#main input,#main select').forEach(e=>e.disabled=true)}
function mark(q,s){
  const fb=$("#fb");fb.textContent=s.right?T.ok:T.bad;fb.className="fb "+(s.right?"ok":"bad");
  if(q.type==="5"){
    document.querySelectorAll('#main select').forEach(e=>{const a=q.answers.find(x=>x.id===e.dataset.id);e.className=s.sel[a.id]===a.text?"ok":"bad"});
    if(!s.right)fb.textContent+=" — "+q.answers.map(a=>a.topic+" → "+a.text).join(" · ");
  }else{
    document.querySelectorAll('#main .ans').forEach(l=>{const a=q.answers.find(x=>x.id===l.dataset.id);
      if(a.ok)l.classList.add("ok");else if(s.sel.has(a.id))l.classList.add("bad")});
  }
}
function finish(){
  const un=st.filter(s=>!s.done).length;
  if(un&&!confirm(T.notAll))return;
  showResults(false);
}
function showResults(){
  clearInterval(tick);
  st.forEach((s,i)=>{if(!s.done){s.done=true;s.right=isRight(order[i],s)}});
  const n=st.filter(s=>s.right).length,tot=order.length,pc=Math.round(100*n/tot);
  $("#qinfo").textContent="";
  const passed=pc>=PASS_RATE;
  let h=`<div class="res"><h2>${T.results}</h2><div class="score">${T.score}: ${n} ${T.of} ${tot} (${pc}%)</div>
   <p>${passed?T.pass:T.fail}</p><p>${T.thanks}</p><h3>${T.review}</h3>`;
  order.forEach((q,i)=>{const s=st[i];
    const given=q.type==="5"?q.answers.map(a=>a.topic+" → "+(s.sel[a.id]||"–")).join(" · "):([...s.sel].map(id=>q.answers.find(a=>a.id===id).text).join(" · ")||T.none);
    const corr=q.type==="5"?q.answers.map(a=>a.topic+" → "+a.text).join(" · "):q.answers.filter(a=>a.ok).map(a=>a.text).join(" · ");
    h+=`<div class="rev"><b class="${s.right?"ok":"bad"}">${i+1}. ${s.right?T.ok:T.bad}</b> ${esc(q.topic)}<small>${T.yours}${esc(given)}</small>${s.right?"":`<small>${T.correctWas}${esc(corr)}</small>`}</div>`});
  h+=`<div class="nav"><button class="btn" id="again">${T.again}</button><button class="btn sec" id="prt">${T.print}</button></div></div>`;
  $("#main").innerHTML=h;$("#again").onclick=start;$("#prt").onclick=()=>window.print();
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
$("#title").textContent=QUIZ_TITLE;
$("#snd").onclick=()=>{sndOn=!sndOn;$("#snd").textContent=sndOn?"🔊":"🔇"};
start();
</script>
</body>
</html>
